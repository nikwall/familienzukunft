name: Angebote aktualisieren

on:
  schedule:
    # Alle 30 Minuten von früh bis spät. Volle Stunden meidet GitHub oft, darum Minute 7 und 37.
    - cron: "7,37 5-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Mails einlesen und Daten erneuern
        env:
          FZ_IMAP_HOST: ${{ secrets.FZ_IMAP_HOST }}
          FZ_IMAP_USER: ${{ secrets.FZ_IMAP_USER }}
          FZ_IMAP_PASSWORT: ${{ secrets.FZ_IMAP_PASSWORT }}
        run: python pipeline/aktualisieren.py
      - name: Speichern
        run: |
          git config user.name "vinifeli-bot"
          git config user.email "45004142+nikwall@users.noreply.github.com"
          git add data/wohnen.json
          if ! git diff --cached --quiet; then
            git commit -m "Angebote aktualisiert"
            git pull --rebase
            git push
          fi
